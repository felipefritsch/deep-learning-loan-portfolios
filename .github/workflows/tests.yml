name: tests

# Run the hermetic unit suite (tests/test_*.py) on every push and PR. The suite is
# synthetic-data only — no external SSD, no GPU, no network — so it runs entirely on a
# standard GitHub-hosted runner. See writeup/memos/test_coverage_review.md for scope.
# Gate every PR, and keep the default branch green. Restricting the push trigger to
# main (rather than all branches) avoids running CI twice on a same-repo PR branch;
# feature branches still get CI via their pull request.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        # Install the CPU torch wheel first so the package's torch==2.8.0 pin is satisfied
        # by it (PEP 440: ==2.8.0 matches 2.8.0+cpu) and the heavy CUDA wheel is never
        # pulled. pool.py/economics.py import torch at module load; with the CPU wheel
        # those tests run instead of skipping (the suite passes either way).
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + test deps
        # Editable install pulls the rest of the deps from pyproject (duckdb, polars,
        # pyarrow, tqdm, numpy, pandas, matplotlib, scikit-learn, lightgbm) and makes the
        # floan.* package importable, so tests use real package paths.
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit suite
        run: python -m pytest   # config in pyproject.toml (testpaths = tests)
